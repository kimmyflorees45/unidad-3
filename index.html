<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - Kimberly Barrera</title>
    <link rel="stylesheet" href="pokedex.css">
</head>
<body>
    <div class="main-container">
        <div class="search-box">
            <input type="text" id="pokeName" placeholder="Escribe el nombre de un Pokémon...">
            <button onclick="fetchPokemon()">Presiona</button>
        </div>

        <div class="pokedex-content">
            <div class="info-panel">
                <img src="pokemaster.jpeg" id="pokeImg" alt="Pokemaster">
                <span id="pokename"></span>
                <div class="data-grid">
                    <div id="pokeHe">Altura: --</div>
                    <div id="pokeWe">Peso: --</div>
                    <div id="pokeorder">Orden: --</div>
                    <div id="pokeid">ID: --</div>
                    <div id="pokeitem">Habilidad: --</div>
                    <div id="pokeType">Tipo: --</div>
                </div>
            </div>

            <div class="stats-panel">
                <h3>Movimientos</h3>
                <div class="moves-list">
                    <div id="pokemove1">Movimiento 1: --</div>
                    <div id="pokemove2">Movimiento 2: --</div>
                    <div id="pokemove3">Movimiento 3: --</div>
                    <div id="pokemove4">Movimiento 4: --</div>
                </div>
                <h3>Estadísticas</h3>
                <div class="grafica">
                    <canvas id="miCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="chart.js"></script>
    <script src="pokedex.js"></script>
</body>
</html>
